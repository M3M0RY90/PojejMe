# lokalna MySQL baza za razvoj (gesla veljajo samo lokalno)
# zagon: docker compose up -d
name: pojejme

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: pojejme
      MYSQL_USER: pojejme
      MYSQL_PASSWORD: pojejme
      MYSQL_ROOT_PASSWORD: pojejme
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
