name: Docker CI

# ob vsaki objavi (push) v vejo main: gradnja, objava slike in deploy na Azure
# ob vsakem pull requestu v main: samo preverimo, da se slika zgradi
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # id-token: write omogoči prijavo v Azure prek OIDC
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # pull request: samo gradnja brez objave, da se napaka vidi pred združitvijo v main
      - name: Build Docker image (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: pojejme-api:pr

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # slika za Intel/AMD in ARM (npr. Apple Silicon)
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ github.sha }}
          # oznaki: latest in SHA trenutnega commita
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pojejme-api:latest
            ${{ secrets.DOCKER_USERNAME }}/pojejme-api:${{ github.sha }}

      # neprekinjena dostava: prijava v Azure z managed identity (OIDC, brez gesla)
      - name: Login to Azure
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # zabojnik v Azure Container Instances ponovno ustvarimo s pravkar zgrajeno sliko
      # povezava na bazo gre v zabojnik kot skrita (secure) okoljska spremenljivka
      - name: Deploy to Azure Container Instances
        if: github.event_name == 'push'
        run: |
          az container delete --resource-group pojejme-matic_group --name pojejme-matic --yes || true
          az container create \
            --resource-group pojejme-matic_group \
            --name pojejme-matic \
            --location spaincentral \
            --image docker.io/${{ secrets.DOCKER_USERNAME }}/pojejme-api:${{ github.sha }} \
            --os-type Linux \
            --cpu 1 \
            --memory 1 \
            --ports 8080 \
            --ip-address Public \
            --dns-name-label pojejme-matic \
            --restart-policy Always \
            --secure-environment-variables "ConnectionStrings__PojejMe=${{ secrets.MYSQL_CONNECTION_STRING }}" "Admin__Kljuc=${{ secrets.ADMIN_KLJUC }}" "Jwt__Kljuc=${{ secrets.JWT_KLJUC }}"
